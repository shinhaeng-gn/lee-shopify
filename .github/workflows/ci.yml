name: CI
on: [push]
jobs:
  build-check:
    name: Build Success Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build React Components
        run: npm run build

      - name: Success Notification
        run: echo "Build successful! Your React components and Shopify theme are ready."
